                  "",
                  "Matched criteria:",
              ])
              for item in report.get("matched_criteria", []):
                  lines.append(f"- {clip(item, 180)}")
              if not report.get("matched_criteria", []):
                  lines.append("- none")
              lines.extend(["", "Missing criteria:"])
              for item in report.get("missing_criteria", []):
                  lines.append(f"- {clip(item, 180)}")
              if not report.get("missing_criteria", []):
                  lines.append("- none")
              lines.extend(["", "Issues:"])
              for issue in report.get("issues", [])[:10]:
                  severity = clip(issue.get("severity", "unknown"), 40)
                  description = clip(issue.get("description", "no description"), 180)
                  evidence = clip(issue.get("evidence", "no evidence"), 160)
                  lines.append(f"- `{severity}`: {description} Evidence: {evidence}")
              if not report.get("issues", []):
                  lines.append("- none")
              lines.extend(["", f"Recommendation: {clip(report.get('recommendation'), 260)}"])
              return lines

          def markdown_comparison_section():
              lines = ["", "## Model Comparison", ""]
              if not comparison_report:
                  lines.append("Dual-model comparison was not available.")
                  return lines
              agreement = comparison_report.get("agreement", {})
