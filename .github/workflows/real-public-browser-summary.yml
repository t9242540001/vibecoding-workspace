name: Real Public Browser Summary

on:
  workflow_dispatch:
    inputs:
      route_id:
        description: Approved route id
        required: true
        default: yurassistent-home
        type: choice
        options:
          - yurassistent-home
      interaction_profile_id:
        description: Approved interaction profile id
        required: true
        default: homepage-load-only
        type: choice
        options:
          - homepage-load-only
          - homepage-primary-cta-presence
          - homepage-content-audit-v1
          - homepage-link-check-v1
      strict_forbidden_scan:
        description: Fail on suspicious forbidden patterns
        required: true
        default: true
        type: boolean
      run_analysis:
        description: Run model analysis after validation
        required: true
        default: true
        type: boolean
      analysis_mode:
        description: Model analysis mode
        required: true
        default: dual-model-comparison
        type: choice
        options:
          - dual-model-comparison
          - single-model
      model_id:
        description: Model id for optional analysis
        required: true
        default: qwen/qwen-plus
        type: choice
        options:
          - qwen/qwen-plus
          - deepseek/deepseek-v4-flash

permissions:
  contents: read

jobs:
  generate-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install temporary browser runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m pip install reportlab
          python -m playwright install --with-deps chromium

      - name: Generate sanitized public browser summary
        env:
          ROUTE_ID: ${{ inputs.route_id }}
          INTERACTION_PROFILE_ID: ${{ inputs.interaction_profile_id }}
          STRICT_FORBIDDEN_SCAN: ${{ inputs.strict_forbidden_scan }}
          RUN_ANALYSIS: ${{ inputs.run_analysis }}
          ANALYSIS_MODE: ${{ inputs.analysis_mode }}
          MODEL_ID: ${{ inputs.model_id }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/real-public-browser-summary

          python - <<'PY'
          import json
          import html
          import hashlib
          import os
          import pathlib
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from playwright.sync_api import TimeoutError as PlaywrightTimeoutError
          from playwright.sync_api import sync_playwright
          from reportlab.lib.pagesizes import letter
          from reportlab.lib.styles import getSampleStyleSheet
          from reportlab.lib.units import inch
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer

          artifact_dir = pathlib.Path("/tmp/real-public-browser-summary")
          route_id = os.environ["ROUTE_ID"]
          profile_id = os.environ["INTERACTION_PROFILE_ID"]
          strict_forbidden_scan = os.environ["STRICT_FORBIDDEN_SCAN"].lower() == "true"
          run_analysis = os.environ["RUN_ANALYSIS"].lower() == "true"
          analysis_mode = os.environ["ANALYSIS_MODE"]
          model_id = os.environ["MODEL_ID"]

          routes_path = pathlib.Path("configs/real-staging-approved-routes.json")
          profiles_path = pathlib.Path("configs/real-staging-interaction-profiles.json")
          contract_path = pathlib.Path("configs/e2e-staging-summary-contract.json")
          model_profiles_path = pathlib.Path("configs/model-profiles.json")

          errors = []
          model_analysis_errors = []
          warnings = []
          forbidden_scan_matches = []
          console_errors = []
          network_errors = []

          def load_json(path, label):
              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except FileNotFoundError:
                  errors.append(f"{label} does not exist: {path}")
              except json.JSONDecodeError as exc:
                  errors.append(f"{label} is not valid JSON: {exc}")
              return None

          routes_config = load_json(routes_path, "approved route config")
          profiles_config = load_json(profiles_path, "interaction profile config")
          contract = load_json(contract_path, "staging summary contract")
          model_profiles = load_json(model_profiles_path, "model profiles")

          route = None
          profile = None
          if routes_config is not None:
              for candidate in routes_config.get("routes", []):
                  if candidate.get("route_id") == route_id:
                      route = candidate
                      break
              if route is None:
                  errors.append(f"Selected route does not exist: {route_id}")

          if profiles_config is not None:
              for candidate in profiles_config.get("profiles", []):
                  if candidate.get("profile_id") == profile_id:
                      profile = candidate
                      break
              if profile is None:
                  errors.append(f"Selected interaction profile does not exist: {profile_id}")

          if route is not None and profile is not None:
              allowed_profiles = route.get("allowed_interaction_profile_ids", [])
              compatible_routes = profile.get("route_compatibility", [])
              if profile_id not in allowed_profiles:
                  errors.append(f"Profile `{profile_id}` is not allowed by route `{route_id}`.")
              if route_id not in compatible_routes:
                  errors.append(f"Profile `{profile_id}` is not compatible with route `{route_id}`.")
              if route.get("auth_required") is not False:
                  errors.append("Selected route must be public no-auth.")
              if route.get("route_type") != "public_no_auth_homepage":
                  errors.append("Selected route must be a public no-auth homepage route.")

              forbidden_actions = set(profile.get("forbidden_actions", []))
              allowed_actions = set(profile.get("allowed_actions", []))
              requested_forbidden = sorted(forbidden_actions.intersection(allowed_actions))
              if requested_forbidden:
                  errors.append(f"Profile requests forbidden actions: {requested_forbidden}")

              globally_blocked_actions = {
                  "click",
                  "type",
                  "submit_form",
                  "upload_file",
                  "login",
                  "payment",
                  "account_creation",
                  "screenshot",
                  "video",
                  "trace",
                  "raw_har",
                  "follow_link",
                  "destructive_action",
              }
              blocked_requested = sorted(globally_blocked_actions.intersection(allowed_actions))
              if blocked_requested:
                  errors.append(f"Profile includes globally blocked actions: {blocked_requested}")

          if errors:
              print("Validation failed before browser launch.")
              for error in errors:
                  print(f"- {error}")
              sys.exit(1)

          def sanitize_text(value):
              text = str(value or "")
              replacements = [
                  (r"https?://\S+", "[redacted-url]"),
                  (r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}", "[redacted-email]"),
                  (r"\+?\d[\d\s().-]{7,}\d", "[redacted-phone]"),
                  (r"Bearer\s+[A-Za-z0-9._~+/=-]+", "[redacted-bearer]"),
                  (r"\b[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\b", "[redacted-token]"),
                  (r"(?i)\b(authorization|cookie|set-cookie|api[_-]?key|token|password|secret)\b\s*[:=][^\s,;]+", "[redacted-header]"),
                  (r"\b10\.\d{1,3}\.\d{1,3}\.\d{1,3}\b", "[redacted-private-ip]"),
                  (r"\b192\.168\.\d{1,3}\.\d{1,3}\b", "[redacted-private-ip]"),
                  (r"\b172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}\b", "[redacted-private-ip]"),
                  (r"C:\\[^\s]+", "[redacted-local-path]"),
                  (r"/home/[^\s]+", "[redacted-local-path]"),
                  (r"\.env", "[redacted-env-file]"),
              ]
              for pattern, replacement in replacements:
                  text = re.sub(pattern, replacement, text)
              return " ".join(text.split())

          def compact_list(items, limit=40, item_limit=240):
              compacted = []
              for item in items:
                  clean = sanitize_text(item)[:item_limit].strip()
                  if clean and clean not in compacted:
                      compacted.append(clean)
                  if len(compacted) >= limit:
                      break
              return compacted

          def add_console_message(message):
              if message.type not in ("error", "warning"):
                  return
              console_errors.append({
                  "level": message.type,
                  "summary": sanitize_text(message.text)[:300],
              })

          def add_request_failure(request):
              failure = request.failure
              if isinstance(failure, dict):
                  failure_text = failure.get("errorText", "request failed")
              else:
                  failure_text = failure or "request failed"
              network_errors.append({
                  "resource_type": request.resource_type,
                  "summary": sanitize_text(failure_text)[:240],
              })

          def add_response_status(response):
              if response.status >= 400:
                  network_errors.append({
                      "resource_type": "response",
                      "status": response.status,
                      "summary": f"HTTP status {response.status}",
                  })

          route_url = route["url"]
          interactions = [
              f"Selected approved route label `{route['route_label']}`.",
              f"Selected approved interaction profile `{profile_id}`.",
              "Opened approved public no-auth route.",
              "Waited for page load.",
              "Collected sanitized visible text.",
              "Collected high-level console and network error summaries.",
          ]

          cta_present = None
          cta_matches = []
          page_title = ""
          visible_text = []
          accessibility_notes = []
          performance_notes = []
          raw_links = []

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              context = browser.new_context(
                  viewport={"width": 1365, "height": 768},
                  ignore_https_errors=False,
              )
              page = context.new_page()
              page.on("console", add_console_message)
              page.on("requestfailed", add_request_failure)
              page.on("response", add_response_status)

              response = page.goto(route_url, wait_until="domcontentloaded", timeout=45000)
              try:
                  page.wait_for_load_state("networkidle", timeout=15000)
              except PlaywrightTimeoutError:
                  performance_notes.append("Network idle wait timed out; summary uses DOM content loaded state.")

              page_title = sanitize_text(page.title())
              body_text = page.locator("body").inner_text(timeout=10000)
              visible_text = compact_list(body_text.splitlines(), limit=80, item_limit=300)

              if response is not None and response.status >= 400:
                  network_errors.append({
                      "resource_type": "document",
                      "status": response.status,
                      "summary": f"Document returned HTTP status {response.status}",
                  })

              if profile_id == "homepage-primary-cta-presence":
                  joined_visible_text = "\n".join(visible_text)
                  normalized_visible_text = " ".join(joined_visible_text.lower().split())
                  candidates = profile.get("primary_cta_detection", {}).get("acceptable_cta_text_candidates", [])
                  cta_matches = [
                      candidate for candidate in candidates
                      if " ".join(str(candidate).lower().split()) in normalized_visible_text
                  ]
                  cta_present = bool(cta_matches)
                  if cta_present:
                      interactions.append("Detected primary CTA candidate from sanitized visible text.")
                  else:
                      interactions.append("No primary CTA candidate was detected in sanitized visible text.")

              if profile_id == "homepage-link-check-v1":
                  raw_links = page.locator("a").evaluate_all(
                      """links => links.slice(0, 120).map(link => ({
                          label: (link.innerText || link.getAttribute('aria-label') || link.textContent || '').trim(),
                          href: link.href || link.getAttribute('href') || ''
                      }))"""
                  )
                  interactions.append("Extracted public link metadata from the loaded page without clicking links.")

              browser.close()

          if visible_text:
              accessibility_notes.append("Visible text was available for sanitized summary generation.")
          if cta_present is not None:
              accessibility_notes.append(f"Primary CTA candidate present: {cta_present}.")
          performance_notes.append("Real public no-auth browser observation; raw timing artifacts were not collected.")

          generated_summary = {
              "summary_id": f"real-public-browser-{route['route_label']}-{profile_id}",
              "source": "real-public-browser-summary",
              "environment_label": route["environment_label"],
              "route_label": route["route_label"],
              "page_title": page_title,
              "visible_text": visible_text,
              "interactions": interactions,
              "acceptance_criteria": profile.get("acceptance_criteria", []),
              "console_errors": compact_list(
                  [item["summary"] for item in console_errors if item.get("level") == "error"],
                  limit=20,
                  item_limit=300,
              ),
              "network_errors": compact_list(
                  [item.get("summary", "") for item in network_errors],
                  limit=20,
                  item_limit=240,
              ),
              "sanitization_notes": [
                  "Approved route label used; full URL omitted from summary artifacts.",
                  "No credentials, cookies, headers, storage state, or session dumps collected.",
                  "No screenshots, videos, traces, or raw HAR collected.",
                  "No request or response bodies collected.",
                  "Visible text and error summaries were sanitized before artifact upload."
              ],
              "accessibility_notes": accessibility_notes,
              "performance_notes": performance_notes,
              "browser": "chromium-headless",
              "viewport": "1365x768",
              "test_timestamp_label": "real-public-browser-run",
              "known_limitations": [
                  "Public no-auth observation only.",
                  "No clicks, link following, form submission, login, or account creation were performed.",
                  "Model analysis, when enabled, receives only this sanitized summary."
              ],
          }
          if cta_present is not None:
              generated_summary["primary_cta_presence"] = {
                  "present": cta_present,
                  "matched_candidates": cta_matches,
                  "method": "normalized sanitized visible text only",
                  "limitations": [
                      "CTA false may mean the CTA is absent or unclear in captured visible text.",
                      "CTA false may mean the CTA text differs from approved candidates.",
                      "CTA false may mean the CTA is rendered in a way safe text-only capture does not see."
                  ]
              }

          def detect_terms(text, terms):
              normalized_text = " ".join(str(text or "").lower().split())
              detected = []
              for term in terms:
                  normalized_term = " ".join(str(term).lower().split())
                  if normalized_term and normalized_term in normalized_text:
                      detected.append(term)
              return detected

          def build_content_audit_signals():
              joined_text = "\n".join(generated_summary.get("visible_text", []))
              target_terms = [
                  "юрист",
                  "юрид",
                  "документ",
                  "договор",
                  "иск",
                  "претенз",
                  "консультац",
                  "помощь",
                  "вопрос",
                  "задача"
              ]
              offer_terms = [
                  "ассистент",
                  "помощник",
                  "подготов",
                  "создать",
                  "сгенер",
                  "разобрать",
                  "проверить",
                  "получить"
              ]
              cta_terms = [
                  "начать",
                  "попробовать",
                  "спросить",
                  "задать вопрос",
                  "создать документ",
                  "получить консультацию",
                  "открыть помощника",
                  "запустить"
              ]
              trust_terms = [
                  "безопас",
                  "конфиденц",
                  "провер",
                  "эксперт",
                  "опыт",
                  "качество",
                  "надеж",
                  "закон",
                  "бесплатно"
              ]
              legal_terms = [
                  "иск",
                  "претенз",
                  "договор",
                  "заявление",
                  "жалоба",
                  "суд",
                  "право",
                  "юрид",
                  "документ"
              ]
              jurisdiction_terms = [
                  "рф",
                  "россия",
                  "российск",
                  "закон",
                  "суд"
              ]
              long_text_block_risk = any(len(item) > 260 for item in generated_summary.get("visible_text", []))
              heading_like_text_present = any(0 < len(item) <= 90 for item in generated_summary.get("visible_text", [])[:12])
              cta_detected = detect_terms(joined_text, cta_terms)
              service_keywords = detect_terms(joined_text, legal_terms)
              generated_summary["content_audit_signals"] = {
                  "target_audience_terms_detected": detect_terms(joined_text, target_terms),
                  "offer_terms_detected": detect_terms(joined_text, offer_terms),
                  "cta_terms_detected": cta_detected,
                  "trust_signal_terms_detected": detect_terms(joined_text, trust_terms),
                  "legal_service_terms_detected": service_keywords,
                  "long_text_block_risk": long_text_block_risk,
                  "visible_text_snippet_count": len(generated_summary.get("visible_text", [])),
                  "limitations": [
                      "Signals are derived from sanitized visible text only.",
                      "No screenshots, DOM dump, visual recognition, clicks, or form interactions were used.",
                      "Detected terms are deterministic input signals, not final content judgment."
                  ]
              }
              generated_summary["seo_basic_signals"] = {
                  "page_title_present": bool(generated_summary.get("page_title")),
                  "heading_like_text_present": heading_like_text_present,
                  "service_keywords_detected": service_keywords,
                  "jurisdiction_terms_detected": detect_terms(joined_text, jurisdiction_terms),
                  "limitations": [
                      "Meta description was not checked.",
                      "SEO signals are text-only and do not inspect page source or structured data."
                  ]
              }
              generated_summary["mobile_readiness_signals"] = {
                  "text_only_mobile_readiness_checked": True,
                  "visual_mobile_layout_checked": False,
                  "cta_text_visible_in_text_capture": bool(cta_detected),
                  "long_text_blocks_risk": long_text_block_risk,
                  "limitations": [
                      "Mobile readiness is text/signal-based only.",
                      "No real mobile screenshot or visual layout proof was collected."
                  ]
              }

          if profile_id == "homepage-content-audit-v1":
              build_content_audit_signals()

          def short_url_hash(value):
              return hashlib.sha256(str(value or "").encode("utf-8")).hexdigest()[:12]

          def sanitize_link_label(value):
              label = sanitize_text(value)
              label = re.sub(
                  r"\b[A-Za-z0-9.-]+\.[A-Za-z]{2,}(?:/[^\s]*)?",
                  "[redacted-domain-like-text]",
                  label,
              )
              return label

          def public_domain_label(parsed):
              host = (parsed.hostname or "").lower()
              if not host:
                  return "not available"
              if re.match(r"^(10|127)\.", host) or host.startswith("192.168.") or re.match(r"^172\.(1[6-9]|2[0-9]|3[0-1])\.", host):
                  return "[redacted-private-endpoint]"
              if host in ("localhost", "0.0.0.0") or host.endswith(".local"):
                  return "[redacted-private-endpoint]"
              return sanitize_text(host)

          def classify_link(href, route_origin):
              href = str(href or "").strip()
              lowered = href.lower()
              parsed = urllib.parse.urlparse(href)
              suspicious_words = [
                  "login",
                  "auth",
                  "admin",
                  "logout",
                  "token",
                  "session",
                  "password",
                  "private"
              ]
              payment_words = [
                  "payment",
                  "billing",
                  "checkout"
              ]
              if not href:
                  return "unknown_or_unsupported", "empty href"
              if lowered.startswith("mailto:"):
                  return "contact_email", "contact email link redacted"
              if lowered.startswith("tel:"):
                  return "contact_phone", "contact phone link redacted"
              if any(name in lowered for name in ("t.me", "telegram", "whatsapp", "wa.me")):
                  return "contact_messenger", "contact messenger link skipped"
              if lowered.startswith("#"):
                  return "anchor", "same-page anchor skipped"
              if parsed.scheme not in ("http", "https"):
                  return "unknown_or_unsupported", "unsupported scheme skipped"
              if any(word in lowered for word in payment_words):
                  return "payment_like", "payment-like link skipped"
              if any(word in lowered for word in suspicious_words):
                  return "private_or_auth_like", "private/auth-like link skipped"
              path = (parsed.path or "").lower()
              if re.search(r"\.(png|jpg|jpeg|gif|svg|webp|ico|css|js|pdf|zip)$", path):
                  return "asset", "asset link skipped"
              host_label = public_domain_label(parsed)
              if host_label == "[redacted-private-endpoint]":
                  return "private_or_auth_like", "private endpoint skipped"
              if f"{parsed.scheme}://{parsed.netloc}".lower() == route_origin.lower():
                  return "internal_public_http", "public same-origin link"
              return "external_public_http", "public external link"

          def check_public_link(href):
              class CappedRedirectHandler(urllib.request.HTTPRedirectHandler):
                  def __init__(self):
                      self.redirect_count = 0

                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      self.redirect_count += 1
                      if self.redirect_count > 3:
                          raise urllib.error.HTTPError(req.full_url, code, "redirect limit exceeded", headers, fp)
                      return super().redirect_request(req, fp, code, msg, headers, newurl)

              redirect_handler = CappedRedirectHandler()
              opener = urllib.request.build_opener(redirect_handler)
              headers = {"User-Agent": "vibe-coding-public-link-check/1.0"}

              def request_status(method):
                  request = urllib.request.Request(href, headers=headers, method=method)
                  with opener.open(request, timeout=8) as response:
                      return response.status

              try:
                  status = request_status("HEAD")
              except urllib.error.HTTPError as exc:
                  if exc.code in (403, 405):
                      try:
                          status = request_status("GET")
                      except TimeoutError:
                          return None, redirect_handler.redirect_count, "timeout", "public link check timed out"
                      except Exception as get_exc:
                          return getattr(get_exc, "code", None), redirect_handler.redirect_count, "error", sanitize_text(type(get_exc).__name__)
                  else:
                      status = exc.code
              except TimeoutError:
                  return None, redirect_handler.redirect_count, "timeout", "public link check timed out"
              except Exception as exc:
                  return None, redirect_handler.redirect_count, "error", sanitize_text(type(exc).__name__)

              if status is None:
                  return None, redirect_handler.redirect_count, "error", "no status returned"
              if status >= 400:
                  return status, redirect_handler.redirect_count, "broken", f"HTTP status {status}"
              if redirect_handler.redirect_count:
                  return status, redirect_handler.redirect_count, "redirected", f"HTTP status {status} after redirect"
              return status, redirect_handler.redirect_count, "ok", f"HTTP status {status}"

          def build_link_check_signals():
              route_parsed = urllib.parse.urlparse(route_url)
              route_origin = f"{route_parsed.scheme}://{route_parsed.netloc}"
              inventory = []
              check_results = []
              checked_count = 0
              for raw_link in raw_links[:50]:
                  href = str(raw_link.get("href", "") if isinstance(raw_link, dict) else "")
                  label = sanitize_link_label(raw_link.get("label", "") if isinstance(raw_link, dict) else "")[:120]
                  link_type, reason = classify_link(href, route_origin)
                  parsed = urllib.parse.urlparse(href)
                  same_origin = parsed.scheme in ("http", "https") and f"{parsed.scheme}://{parsed.netloc}".lower() == route_origin.lower()
                  entry = {
                      "label": label or "unlabeled link",
                      "url_hash": short_url_hash(href),
                      "domain_label": public_domain_label(parsed) if parsed.scheme in ("http", "https") else "not applicable",
                      "same_origin": bool(same_origin),
                      "link_type": link_type,
                      "checked": False,
                      "status_code": None,
                      "redirect_count": 0,
                      "result": "skipped_unsupported",
                      "reason": sanitize_text(reason)[:180]
                  }
                  if link_type in ("contact_email", "contact_phone", "contact_messenger"):
                      entry["result"] = "skipped_contact_link"
                  elif link_type == "private_or_auth_like":
                      entry["result"] = "skipped_private_or_auth_like"
                  elif link_type == "payment_like":
                      entry["result"] = "skipped_payment_like"
                  elif link_type in ("anchor", "asset", "unknown_or_unsupported"):
                      entry["result"] = "skipped_unsupported"
                  elif link_type in ("internal_public_http", "external_public_http") and checked_count < 30:
                      status_code, redirect_count, result, check_reason = check_public_link(href)
                      entry.update({
                          "checked": True,
                          "status_code": status_code,
                          "redirect_count": redirect_count,
                          "result": result,
                          "reason": sanitize_text(check_reason)[:180]
                      })
                      checked_count += 1
                      check_results.append(dict(entry))
                  inventory.append(entry)

              ok_count = sum(1 for item in inventory if item.get("result") == "ok")
              broken_count = sum(1 for item in inventory if item.get("result") == "broken")
              redirected_count = sum(1 for item in inventory if item.get("result") == "redirected")
              skipped_count = sum(1 for item in inventory if str(item.get("result", "")).startswith("skipped_"))
              contact_count = sum(1 for item in inventory if item.get("link_type") in ("contact_email", "contact_phone", "contact_messenger"))
              private_count = sum(1 for item in inventory if item.get("link_type") == "private_or_auth_like")
              payment_count = sum(1 for item in inventory if item.get("link_type") == "payment_like")
              generated_summary["link_check_summary"] = {
                  "total_links_seen": len(raw_links),
                  "links_checked_count": checked_count,
                  "ok_count": ok_count,
                  "broken_count": broken_count,
                  "redirected_count": redirected_count,
                  "skipped_count": skipped_count,
                  "contact_link_count": contact_count,
                  "private_or_auth_like_count": private_count,
                  "payment_like_count": payment_count,
                  "limitations": [
                      "Full URLs, query strings, fragments, headers, and bodies are not stored.",
                      "Links are checked with status-only HEAD or GET requests where safe.",
                      "Private/auth/payment/logout-like links are classified and skipped.",
                      "Contact links are classified but not opened."
                  ]
              }
              generated_summary["public_link_inventory"] = inventory
              generated_summary["public_link_check_results"] = check_results[:30]
              generated_summary["contact_link_signals"] = {
                  "has_email_link": any(item.get("link_type") == "contact_email" for item in inventory),
                  "has_phone_link": any(item.get("link_type") == "contact_phone" for item in inventory),
                  "has_messenger_link": any(item.get("link_type") == "contact_messenger" for item in inventory),
                  "contact_link_count": contact_count,
                  "redaction_note": "Email addresses, phone numbers, and messenger targets are not stored in raw form."
              }

          if profile_id == "homepage-link-check-v1":
              build_link_check_signals()

          generated_path = artifact_dir / "generated-summary.json"
          generated_path.write_text(
              json.dumps(generated_summary, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          required_fields_checked = []
          required_types = {
              "summary_id": str,
              "source": str,
              "environment_label": str,
              "route_label": str,
              "page_title": str,
              "visible_text": list,
              "interactions": list,
              "acceptance_criteria": list,
              "console_errors": list,
              "network_errors": list,
              "sanitization_notes": list,
          }

          for field in contract.get("required_summary_fields", []):
              required_fields_checked.append(field)
              if field not in generated_summary:
                  errors.append(f"Missing required field: {field}")

          for field, expected_type in required_types.items():
              if field in generated_summary and not isinstance(generated_summary[field], expected_type):
                  errors.append(f"Field `{field}` has wrong type.")

          for field in ("acceptance_criteria", "visible_text", "sanitization_notes"):
              value = generated_summary.get(field)
              if isinstance(value, list):
                  if not value:
                      errors.append(f"`{field}` must not be empty.")
                  if not all(isinstance(item, str) and item.strip() for item in value):
                      errors.append(f"`{field}` must contain non-empty strings.")

          serialized = json.dumps(generated_summary, ensure_ascii=False, sort_keys=True)
          forbidden_patterns = [
              ("http-url", r"http://"),
              ("https-url", r"https://"),
              ("bearer-token", r"Bearer\s+"),
              ("authorization-header", r"Authorization"),
              ("cookie-header", r"Cookie"),
              ("set-cookie-header", r"Set-Cookie"),
              ("api-key", r"api_key"),
              ("apikey", r"apikey"),
              ("token-assignment", r"\btoken\s*[:=]"),
              ("password", r"password"),
              ("secret", r"secret"),
              ("private-ip-10", r"\b10\."),
              ("private-ip-192", r"\b192\.168\."),
              ("private-ip-172", r"\b172\.(1[6-9]|2[0-9]|3[0-1])\."),
              ("email-like", r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}"),
              ("jwt-like", r"\b[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\b"),
              ("windows-local-path", r"C:\\"),
              ("unix-home-path", r"/home/"),
              ("env-file", r"\.env"),
          ]
          for name, pattern in forbidden_patterns:
              matches = re.findall(pattern, serialized)
              if matches:
                  forbidden_scan_matches.append({"pattern": name, "count": len(matches)})

          if forbidden_scan_matches:
              message = f"Forbidden scan found {len(forbidden_scan_matches)} suspicious pattern groups."
              if strict_forbidden_scan:
                  errors.append(message)
              else:
                  warnings.append(message)

          validation_report = {
              "route_id": route_id,
              "route_label": route["route_label"],
              "interaction_profile_id": profile_id,
              "valid": not errors,
              "errors": errors,
              "warnings": warnings,
              "required_fields_checked": required_fields_checked,
              "forbidden_scan_matches": forbidden_scan_matches,
              "strict_forbidden_scan": strict_forbidden_scan,
              "artifacts": [
                  "generated-summary.json",
                  "validation-report.json",
                  "model-report.json",
                  "model-report-qwen.json",
                  "model-report-deepseek.json",
                  "model-comparison-report.json",
                  "summary.md",
                  "report.html",
                  "report.pdf"
              ]
          }
          (artifact_dir / "validation-report.json").write_text(
              json.dumps(validation_report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          analysis_ran = False
          analysis_provider = None
          analysis_passed = None
          analysis_score = None
          recommendation = None
          attempts = None
          model_report_data = None
          qwen_report_data = None
          deepseek_report_data = None
          comparison_report = None

          def validate_model_report(report):
              report_errors = []
              if not isinstance(report.get("passed"), bool):
                  report_errors.append("`passed` must be boolean.")
              if not isinstance(report.get("score"), (int, float)):
                  report_errors.append("`score` must be numeric.")
              elif report["score"] < 0 or report["score"] > 1:
                  report_errors.append("`score` must be between 0 and 1.")
              if not isinstance(report.get("summary"), str):
                  report_errors.append("`summary` must be string.")
              for field in ("matched_criteria", "missing_criteria", "issues"):
                  if not isinstance(report.get(field), list):
                      report_errors.append(f"`{field}` must be array.")
              for issue in report.get("issues", []):
                  if not isinstance(issue, dict):
                      report_errors.append("Each issue must be an object.")
                      continue
                  for field in ("severity", "description", "evidence"):
                      if field not in issue:
                          report_errors.append(f"Each issue must include `{field}`.")
                      elif not isinstance(issue[field], str):
                          report_errors.append(f"Issue field `{field}` must be string.")
              if not isinstance(report.get("recommendation"), str):
                  report_errors.append("`recommendation` must be string.")
              return report_errors

          def call_model_after_validation(target_model_id, output_name):
              allowed_models = route.get("model_analysis", {}).get(
                  "allowed_models",
                  routes_config.get("model_analysis", {}).get("allowed_models", []),
              )
              if target_model_id not in allowed_models:
                  raise SystemExit(f"Selected model is not approved for this route: {target_model_id}")

              model = model_profiles.get("models", {}).get(target_model_id) if model_profiles else None
              if model is None:
                  raise SystemExit(f"Model not found in configs/model-profiles.json: {target_model_id}")

              provider = model.get("provider")
              if provider not in ("qwen", "deepseek"):
                  raise SystemExit("Only Qwen and DeepSeek models are allowed in this workflow.")
              if provider == "gemini" or target_model_id.startswith("gemini/"):
                  raise SystemExit("Gemini is excluded from the first real public browser analysis flow.")
              modality = model.get("modality", "")
              if "text" not in [part.strip() for part in modality.split(",")]:
                  raise SystemExit(f"Model is not text-capable: {target_model_id}")
              if model.get("smoke_status") == "not_tested":
                  raise SystemExit(f"Model has not passed smoke: {target_model_id}")
              if str(model.get("status", "")).startswith("candidate"):
                  raise SystemExit(f"Model is not active for this flow: {target_model_id}")

              report_schema = contract.get("model_report_schema", {})
              system_prompt = (
                  "You evaluate sanitized public Browser/E2E summaries. "
                  "Return strict JSON only. Do not use markdown fences."
              )
              user_payload = {
                  "sanitized_summary": generated_summary,
                  "acceptance_criteria": generated_summary.get("acceptance_criteria", []),
                  "report_schema": report_schema,
              }
              if profile_id == "homepage-content-audit-v1":
                  analysis_frame = "content audit from sanitized visible text"
              elif profile_id == "homepage-link-check-v1":
                  analysis_frame = "public link check from sanitized link metadata"
              else:
                  analysis_frame = "public browser summary"
              user_prompt = (
                  f"Analyze this sanitized {analysis_frame} against the acceptance criteria. "
                  "Return JSON with fields: passed, score, summary, matched_criteria, "
                  "missing_criteria, issues, recommendation.\n\n"
                  + json.dumps(user_payload, ensure_ascii=False, indent=2)
              )

              model_name = model["model"]
              if provider == "deepseek":
                  endpoint = "https://api.deepseek.com/chat/completions"
                  api_key = os.environ["DEEPSEEK_API_KEY"]
                  payload = {
                      "model": model_name,
                      "messages": [
                          {"role": "system", "content": system_prompt},
                          {"role": "user", "content": user_prompt},
                      ],
                      "temperature": 0,
                      "max_tokens": 900,
                      "thinking": {"type": "disabled"},
                  }
              else:
                  endpoint = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1/chat/completions"
                  api_key = os.environ["DASHSCOPE_API_KEY"]
                  payload = {
                      "model": model_name,
                      "messages": [
                          {"role": "system", "content": system_prompt},
                          {"role": "user", "content": user_prompt},
                      ],
                      "temperature": 0,
                      "max_tokens": 900,
                  }

              transient_statuses = {429, 500, 502, 503, 504}
              delays = [3, 6]

              def post_with_retry():
                  last_status = None
                  last_body = None
                  last_error = None
                  headers = {
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                  }
                  for attempt_index in range(3):
                      body = json.dumps(payload).encode("utf-8")
                      request = urllib.request.Request(endpoint, data=body, headers=headers, method="POST")
                      try:
                          with urllib.request.urlopen(request, timeout=60) as response:
                              return attempt_index + 1, response.status, response.read().decode("utf-8"), None
                      except urllib.error.HTTPError as exc:
                          last_status = exc.code
                          last_body = exc.read().decode("utf-8", errors="replace")
                          last_error = f"HTTP {exc.code}"
                      except urllib.error.URLError as exc:
                          last_error = f"URL error: {exc.reason}"

                      if last_status in transient_statuses and attempt_index < 2:
                          time.sleep(delays[attempt_index])
                          continue
                      break

                  return attempt_index + 1, last_status, last_body, last_error

              attempt_count, http_status, raw_body, request_error = post_with_retry()
              if request_error or not http_status or http_status < 200 or http_status >= 300:
                  raise SystemExit(f"Provider request failed after {attempt_count} attempt(s): {request_error or http_status}")

              try:
                  parsed_response = json.loads(raw_body)
              except json.JSONDecodeError:
                  raise SystemExit("Provider response was not valid JSON.")

              choices = parsed_response.get("choices") or []
              message = choices[0].get("message", {}) if choices else {}
              model_text = (message.get("content") or "").strip()
              if not model_text:
                  raise SystemExit("Model output content was empty.")

              try:
                  parsed_report = json.loads(model_text)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"Model output was not strict JSON: {exc}")

              report_errors = validate_model_report(parsed_report)
              if report_errors:
                  for error in report_errors:
                      print(f"Report schema error: {error}")
                  sys.exit(1)
              serialized_report = json.dumps(parsed_report, ensure_ascii=False, sort_keys=True)
              model_report_matches = []
              for name, pattern in forbidden_patterns:
                  matches = re.findall(pattern, serialized_report)
                  if matches:
                      model_report_matches.append({"pattern": name, "count": len(matches)})
              if model_report_matches:
                  raise SystemExit("Model report failed forbidden-pattern scan.")

              (artifact_dir / output_name).write_text(
                  json.dumps(parsed_report, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )
              return {
                  "model_id": target_model_id,
                  "provider": provider,
                  "passed": parsed_report.get("passed"),
                  "score": parsed_report.get("score"),
                  "recommendation": parsed_report.get("recommendation"),
                  "attempts": attempt_count,
                  "report": parsed_report,
              }

          def report_issue_texts(report):
              texts = []
              for issue in report.get("issues", []):
                  pieces = [
                      str(issue.get("severity", "")),
                      str(issue.get("description", "")),
                      str(issue.get("evidence", "")),
                  ]
                  texts.append(" ".join(pieces).lower())
              return texts

          def has_topic(report, topic_words):
              haystack = " ".join(report_issue_texts(report) + [
                  str(report.get("summary", "")).lower(),
                  str(report.get("recommendation", "")).lower(),
              ])
              return any(word in haystack for word in topic_words)

          def recommendation_alignment(first, second):
              first_words = set(re.findall(r"[a-zа-яё0-9]+", str(first or "").lower()))
              second_words = set(re.findall(r"[a-zа-яё0-9]+", str(second or "").lower()))
              if not first_words or not second_words:
                  return "partially_aligned"
              overlap = len(first_words.intersection(second_words))
              ratio = overlap / max(1, min(len(first_words), len(second_words)))
              if ratio >= 0.45:
                  return "aligned"
              if ratio >= 0.2:
                  return "partially_aligned"
              return "diverged"

          def build_comparison(qwen_report, deepseek_report):
              qwen_score = float(qwen_report.get("score", 0))
              deepseek_score = float(deepseek_report.get("score", 0))
              score_delta = abs(qwen_score - deepseek_score)
              shared_findings = []
              differences = []
              qwen_topics = report_issue_texts(qwen_report)
              deepseek_topics = report_issue_texts(deepseek_report)
              topic_checks = [
                  ("CTA issue", ["cta", "call-to-action", "кноп", "призыв"]),
                  ("technical or network issue", ["network", "console", "401", "http", "error", "ошиб"]),
                  ("visible text issue", ["visible", "text", "контент", "текст"]),
              ]
              for label, words in topic_checks:
                  qwen_has = has_topic(qwen_report, words)
                  deepseek_has = has_topic(deepseek_report, words)
                  if qwen_has and deepseek_has:
                      shared_findings.append(f"Both reports mention a {label}.")
                  elif qwen_has != deepseek_has:
                      differences.append(f"Only one report mentions a {label}.")
              for qwen_issue in qwen_topics:
                  qwen_words = set(re.findall(r"[a-zа-яё0-9]+", qwen_issue))
                  if not qwen_words:
                      continue
                  for deepseek_issue in deepseek_topics:
                      deepseek_words = set(re.findall(r"[a-zа-яё0-9]+", deepseek_issue))
                      if len(qwen_words.intersection(deepseek_words)) >= 3:
                          shared_findings.append(sanitize_text(qwen_issue)[:180])
                          break
                  if len(shared_findings) >= 8:
                      break
              if qwen_report.get("passed") != deepseek_report.get("passed"):
                  differences.append("Model pass/fail results differ.")
              if score_delta >= 0.2:
                  differences.append(f"Model scores differ materially: delta {score_delta:.2f}.")
              alignment = recommendation_alignment(
                  qwen_report.get("recommendation"),
                  deepseek_report.get("recommendation"),
              )
              if not shared_findings:
                  shared_findings.append("No conservative shared finding identified by deterministic text matching.")
              if not differences:
                  differences.append("No notable deterministic difference identified.")
              if qwen_report.get("passed") and deepseek_report.get("passed"):
                  combined_recommendation = "Both approved models passed the sanitized summary; review artifacts for details before relying on the result."
              elif not qwen_report.get("passed") and not deepseek_report.get("passed"):
                  combined_recommendation = "Both approved models found issues; review CTA, console, and network evidence before expanding this flow."
              else:
                  combined_recommendation = "Approved models disagreed; treat this as needing human review before any follow-up decision."
              return {
                  "analysis_mode": "dual-model-comparison",
                  "models_compared": [
                      "qwen/qwen-plus",
                      "deepseek/deepseek-v4-flash",
                  ],
                  "agreement": {
                      "both_passed": bool(qwen_report.get("passed") and deepseek_report.get("passed")),
                      "both_failed": bool(not qwen_report.get("passed") and not deepseek_report.get("passed")),
                      "passed_agreement": qwen_report.get("passed") == deepseek_report.get("passed"),
                      "score_delta": round(score_delta, 4),
                      "recommendation_alignment": alignment,
                  },
                  "qwen_result": {
                      "passed": qwen_report.get("passed"),
                      "score": qwen_report.get("score"),
                      "recommendation": qwen_report.get("recommendation"),
                      "issue_count": len(qwen_report.get("issues", [])),
                  },
                  "deepseek_result": {
                      "passed": deepseek_report.get("passed"),
                      "score": deepseek_report.get("score"),
                      "recommendation": deepseek_report.get("recommendation"),
                      "issue_count": len(deepseek_report.get("issues", [])),
                  },
                  "shared_findings": shared_findings[:8],
                  "differences": differences[:8],
                  "combined_recommendation": combined_recommendation,
                  "confidence_note": "Agreement between Qwen and DeepSeek is stronger evidence; disagreement requires human review.",
              }

          if errors:
              analysis_note = "not run; validation failed"
          elif forbidden_scan_matches:
              analysis_note = "not run; forbidden scan matched"
          elif run_analysis:
              analysis_ran = True
              try:
                  if analysis_mode == "dual-model-comparison":
                      qwen_result = call_model_after_validation("qwen/qwen-plus", "model-report-qwen.json")
                      deepseek_result = call_model_after_validation("deepseek/deepseek-v4-flash", "model-report-deepseek.json")
                      qwen_report_data = qwen_result["report"]
                      deepseek_report_data = deepseek_result["report"]
                      model_report_data = qwen_report_data
                      analysis_provider = "qwen/deepseek"
                      analysis_passed = bool(qwen_report_data.get("passed") and deepseek_report_data.get("passed"))
                      analysis_score = round((float(qwen_report_data.get("score", 0)) + float(deepseek_report_data.get("score", 0))) / 2, 4)
                      recommendation = "See model-comparison-report.json for combined recommendation."
                      attempts = qwen_result["attempts"] + deepseek_result["attempts"]
                      comparison_report = build_comparison(qwen_report_data, deepseek_report_data)
                      (artifact_dir / "model-comparison-report.json").write_text(
                          json.dumps(comparison_report, ensure_ascii=False, indent=2),
                          encoding="utf-8",
                      )
                      (artifact_dir / "model-report.json").write_text(
                          json.dumps(qwen_report_data, ensure_ascii=False, indent=2),
                          encoding="utf-8",
                      )
                      analysis_note = "run; dual-model comparison"
                  else:
                      analysis_result = call_model_after_validation(model_id, "model-report.json")
                      analysis_provider = analysis_result["provider"]
                      analysis_passed = analysis_result["passed"]
                      analysis_score = analysis_result["score"]
                      recommendation = analysis_result["recommendation"]
                      attempts = analysis_result["attempts"]
                      model_report_data = analysis_result["report"]
                      analysis_note = "run; single-model"
              except SystemExit as exc:
                  model_analysis_errors.append(f"Model analysis failed: {exc}")
                  analysis_note = "failed"
          else:
              analysis_note = "not run; disabled by input"

          if model_analysis_errors:
              validation_report["model_analysis_errors"] = model_analysis_errors
              (artifact_dir / "validation-report.json").write_text(
                  json.dumps(validation_report, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )

          def clip(value, limit=180):
              text = sanitize_text(value)
              if len(text) <= limit:
                  return text
              return text[: max(0, limit - 1)].rstrip() + "..."

          def cta_status():
              cta = generated_summary.get("primary_cta_presence")
              if not isinstance(cta, dict):
                  return "not available"
              return str(cta.get("present"))

          def cta_limitation_note():
              cta = generated_summary.get("primary_cta_presence")
              if not isinstance(cta, dict) or cta.get("present") is not False:
                  return None
              return "CTA detection is sanitized visible-text only; false can mean the CTA is absent, uses unexpected text, or is not exposed to safe text capture."

          validation_passed = not errors
          forbidden_count = len(forbidden_scan_matches)
          if not validation_passed or forbidden_count or model_analysis_errors:
              overall_label = "Technical failure"
          elif not analysis_ran or model_report_data is None:
              overall_label = "Analysis not run"
          elif analysis_passed is True:
              overall_label = "Passed"
          else:
              overall_label = "Needs review"

          visible_sample = [clip(item, 160) for item in generated_summary.get("visible_text", [])[:8]]
          if not visible_sample:
              visible_sample = ["not available"]

          artifact_names = [
              "generated-summary.json",
              "validation-report.json",
          ]
          if analysis_ran and comparison_report is not None:
              artifact_names.extend([
                  "model-report-qwen.json",
                  "model-report-deepseek.json",
                  "model-comparison-report.json",
                  "model-report.json",
              ])
          elif analysis_ran and model_report_data is not None:
              artifact_names.append("model-report.json")
          artifact_names.extend(["summary.md", "report.html", "report.pdf"])

          model_summary = model_report_data.get("summary") if model_report_data else None
          matched_criteria = model_report_data.get("matched_criteria", []) if model_report_data else []
          missing_criteria = model_report_data.get("missing_criteria", []) if model_report_data else []
          model_issues = model_report_data.get("issues", []) if model_report_data else []

          def markdown_model_section(title, report):
              lines = ["", f"## {title}", ""]
              if not report:
                  lines.append("Model analysis was not available.")
                  return lines
              lines.extend([
                  f"- Model report passed: `{report.get('passed')}`",
                  f"- Score: `{report.get('score')}`",
                  f"- Summary: {clip(report.get('summary'), 260)}",
                  "",
                  "Matched criteria:",
              ])
              for item in report.get("matched_criteria", []):
                  lines.append(f"- {clip(item, 180)}")
              if not report.get("matched_criteria", []):
                  lines.append("- none")
              lines.extend(["", "Missing criteria:"])
              for item in report.get("missing_criteria", []):
                  lines.append(f"- {clip(item, 180)}")
              if not report.get("missing_criteria", []):
                  lines.append("- none")
              lines.extend(["", "Issues:"])
              for issue in report.get("issues", [])[:10]:
                  severity = clip(issue.get("severity", "unknown"), 40)
                  description = clip(issue.get("description", "no description"), 180)
                  evidence = clip(issue.get("evidence", "no evidence"), 160)
                  lines.append(f"- `{severity}`: {description} Evidence: {evidence}")
              if not report.get("issues", []):
                  lines.append("- none")
              lines.extend(["", f"Recommendation: {clip(report.get('recommendation'), 260)}"])
              return lines

          def markdown_comparison_section():
              lines = ["", "## Model Comparison", ""]
              if not comparison_report:
                  lines.append("Dual-model comparison was not available.")
                  return lines
              agreement = comparison_report.get("agreement", {})
              lines.extend([
                  f"- Passed agreement: `{agreement.get('passed_agreement')}`",
                  f"- Both passed: `{agreement.get('both_passed')}`",
                  f"- Both failed: `{agreement.get('both_failed')}`",
                  f"- Score delta: `{agreement.get('score_delta')}`",
                  f"- Recommendation alignment: `{agreement.get('recommendation_alignment')}`",
                  f"- Combined recommendation: {clip(comparison_report.get('combined_recommendation'), 260)}",
