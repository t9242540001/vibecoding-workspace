                  f"- Confidence note: {clip(comparison_report.get('confidence_note'), 260)}",
                  "",
                  "Shared findings:",
              ])
              for item in comparison_report.get("shared_findings", [])[:8]:
                  lines.append(f"- {clip(item, 180)}")
              lines.extend(["", "Differences:"])
              for item in comparison_report.get("differences", [])[:8]:
                  lines.append(f"- {clip(item, 180)}")
