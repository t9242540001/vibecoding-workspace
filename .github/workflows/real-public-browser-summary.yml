              f"CTA detection note: {cta_limitation_note() or 'not applicable'}",
          ])
          add_pdf_heading(story, styles, "Page Understanding")
          add_pdf_paragraph(story, styles, f"Page title: {clip(generated_summary.get('page_title'), 180)}")
          add_pdf_bullets(story, styles, visible_sample)
          def add_pdf_content_audit_section():
              content = generated_summary.get("content_audit_signals")
              seo = generated_summary.get("seo_basic_signals")
              mobile = generated_summary.get("mobile_readiness_signals")
              if not content:
                  return
              add_pdf_heading(story, styles, "Content Audit Signals")
              add_pdf_bullets(story, styles, [
                  f"Target audience terms: {', '.join(content.get('target_audience_terms_detected', [])) or 'none detected'}",
                  f"Offer terms: {', '.join(content.get('offer_terms_detected', [])) or 'none detected'}",
                  f"CTA terms: {', '.join(content.get('cta_terms_detected', [])) or 'none detected'}",
                  f"Trust signal terms: {', '.join(content.get('trust_signal_terms_detected', [])) or 'none detected'}",
                  f"Legal service terms: {', '.join(content.get('legal_service_terms_detected', [])) or 'none detected'}",
                  f"Long text block risk: {content.get('long_text_block_risk')}",
                  f"Visible text snippet count: {content.get('visible_text_snippet_count')}",
              ])
              add_pdf_paragraph(story, styles, "SEO basic signals:")
              add_pdf_bullets(story, styles, [
                  f"Page title present: {(seo or {}).get('page_title_present', 'not available')}",
                  f"Heading-like text present: {(seo or {}).get('heading_like_text_present', 'not available')}",
                  f"Service keywords: {', '.join((seo or {}).get('service_keywords_detected', [])) or 'none detected'}",
                  f"Jurisdiction terms: {', '.join((seo or {}).get('jurisdiction_terms_detected', [])) or 'none detected'}",
              ])
              add_pdf_paragraph(story, styles, "Mobile readiness signals:")
              add_pdf_bullets(story, styles, [
                  f"Text-only mobile readiness checked: {(mobile or {}).get('text_only_mobile_readiness_checked', 'not available')}",
                  f"Visual mobile layout checked: {(mobile or {}).get('visual_mobile_layout_checked', 'not available')}",
                  f"CTA text visible in text capture: {(mobile or {}).get('cta_text_visible_in_text_capture', 'not available')}",
                  f"Long text blocks risk: {(mobile or {}).get('long_text_blocks_risk', 'not available')}",
              ])
              limitations = (
                  content.get("limitations", [])
                  + (seo or {}).get("limitations", [])
                  + (mobile or {}).get("limitations", [])
              )
              add_pdf_paragraph(story, styles, "Limitations:")
              add_pdf_bullets(story, styles, [clip(item, 180) for item in limitations] or ["none"])

          add_pdf_content_audit_section()
          def add_pdf_link_check_section():
              link_summary = generated_summary.get("link_check_summary")
              if not link_summary:
                  return
              inventory = generated_summary.get("public_link_inventory", [])
              results = generated_summary.get("public_link_check_results", [])
              contact = generated_summary.get("contact_link_signals", {})
              broken = [item for item in results if item.get("result") in ("broken", "timeout", "error")][:8]
              skipped_sensitive = [
                  item for item in inventory
                  if item.get("result") in ("skipped_private_or_auth_like", "skipped_payment_like")
              ][:8]
              add_pdf_heading(story, styles, "Link Check Results")
              add_pdf_bullets(story, styles, [
                  f"Total links seen: {link_summary.get('total_links_seen')}",
                  f"Links checked: {link_summary.get('links_checked_count')}",
                  f"OK links: {link_summary.get('ok_count')}",
                  f"Broken links: {link_summary.get('broken_count')}",
                  f"Redirected links: {link_summary.get('redirected_count')}",
                  f"Skipped links: {link_summary.get('skipped_count')}",
                  f"Contact links found: {link_summary.get('contact_link_count')}",
                  f"Private/auth-like links skipped: {link_summary.get('private_or_auth_like_count')}",
                  f"Payment-like links skipped: {link_summary.get('payment_like_count')}",
              ])
              add_pdf_paragraph(story, styles, "Contact link signals:")
              add_pdf_bullets(story, styles, [
                  f"Email link present: {contact.get('has_email_link', 'not available')}",
                  f"Phone link present: {contact.get('has_phone_link', 'not available')}",
                  f"Messenger link present: {contact.get('has_messenger_link', 'not available')}",
                  f"Redaction note: {clip(contact.get('redaction_note', 'not available'), 180)}",
              ])
              add_pdf_paragraph(story, styles, "Top broken/error links:")
              add_pdf_bullets(story, styles, [
                  f"{item.get('result')} label {clip(item.get('label'), 80)} hash {item.get('url_hash')} status {item.get('status_code')} reason {clip(item.get('reason'), 120)}"
                  for item in broken
              ] or ["none"])
              add_pdf_paragraph(story, styles, "Top skipped private/auth/payment-like links:")
              add_pdf_bullets(story, styles, [
                  f"{item.get('result')} label {clip(item.get('label'), 80)} type {item.get('link_type')} hash {item.get('url_hash')}"
                  for item in skipped_sensitive
              ] or ["none"])
              add_pdf_paragraph(story, styles, "Limitations:")
              add_pdf_bullets(story, styles, [clip(item, 180) for item in link_summary.get("limitations", [])] or ["none"])

          add_pdf_link_check_section()
          def add_pdf_model_section(title, report):
              add_pdf_heading(story, styles, title)
              if not report:
                  add_pdf_paragraph(story, styles, "Model analysis was not available.")
                  return
              add_pdf_bullets(story, styles, [
                  f"Model report passed: {report.get('passed')}",
                  f"Score: {report.get('score')}",
                  f"Summary: {clip(report.get('summary'), 260)}",
              ])
              add_pdf_paragraph(story, styles, "Matched criteria:")
              add_pdf_bullets(story, styles, [clip(item, 180) for item in report.get("matched_criteria", [])] or ["none"])
              add_pdf_paragraph(story, styles, "Missing criteria:")
              add_pdf_bullets(story, styles, [clip(item, 180) for item in report.get("missing_criteria", [])] or ["none"])
              add_pdf_paragraph(story, styles, "Issues:")
              add_pdf_bullets(story, styles, [
                  f"{clip(issue.get('severity', 'unknown'), 40)}: {clip(issue.get('description', 'no description'), 180)} Evidence: {clip(issue.get('evidence', 'no evidence'), 160)}"
                  for issue in report.get("issues", [])[:10]
              ] or ["none"])
              add_pdf_paragraph(story, styles, f"Recommendation: {clip(report.get('recommendation'), 260)}")

          if comparison_report:
              add_pdf_model_section("Qwen Analysis", qwen_report_data)
              add_pdf_model_section("DeepSeek Analysis", deepseek_report_data)
              add_pdf_heading(story, styles, "Model Comparison")
              agreement = comparison_report.get("agreement", {})
              add_pdf_bullets(story, styles, [
                  f"Passed agreement: {agreement.get('passed_agreement')}",
                  f"Both passed: {agreement.get('both_passed')}",
                  f"Both failed: {agreement.get('both_failed')}",
                  f"Score delta: {agreement.get('score_delta')}",
                  f"Recommendation alignment: {agreement.get('recommendation_alignment')}",
                  f"Combined recommendation: {clip(comparison_report.get('combined_recommendation'), 260)}",
                  f"Confidence note: {clip(comparison_report.get('confidence_note'), 260)}",
              ])
              add_pdf_paragraph(story, styles, "Shared findings:")
              add_pdf_bullets(story, styles, [clip(item, 180) for item in comparison_report.get("shared_findings", [])[:8]] or ["none"])
              add_pdf_paragraph(story, styles, "Differences:")
              add_pdf_bullets(story, styles, [clip(item, 180) for item in comparison_report.get("differences", [])[:8]] or ["none"])
          else:
              add_pdf_model_section("Qwen Analysis", model_report_data if analysis_provider == "qwen" else None)
              add_pdf_model_section("DeepSeek Analysis", model_report_data if analysis_provider == "deepseek" else None)
              add_pdf_heading(story, styles, "Model Comparison")
              add_pdf_paragraph(story, styles, "Dual-model comparison was not available.")
          add_pdf_heading(story, styles, "Safety Boundaries")
          add_pdf_bullets(story, styles, [
              "Sanitized summary only.",
              "No screenshots, videos, traces, or raw HAR.",
              "No cookies, storage state, or auth headers.",
              "No raw request or response bodies.",
              "No raw provider response.",
              "No credentials or private data.",
          ])
          add_pdf_heading(story, styles, "Artifacts")
          add_pdf_bullets(story, styles, artifact_names)
          SimpleDocTemplate(str(pdf_path), pagesize=letter, rightMargin=0.55 * inch, leftMargin=0.55 * inch, topMargin=0.55 * inch, bottomMargin=0.55 * inch).build(story)

          print(f"Route id: {route_id}")
          print(f"Route label: {route['route_label']}")
          print(f"Interaction profile: {profile_id}")
          print("Generated summary artifact: generated-summary.json")
          print(f"Validation passed: {not errors}")
          print(f"Visible text snippets: {len(visible_text)}")
          print(f"Console error summaries: {len(generated_summary['console_errors'])}")
          print(f"Network error summaries: {len(generated_summary['network_errors'])}")
          print(f"Forbidden scan matches: {len(forbidden_scan_matches)}")
          print(f"Model analysis: {analysis_note}")
          if analysis_ran:
              print(f"Model id: {model_id}")
              print(f"Provider: {analysis_provider}")
              print(f"Model report passed: {analysis_passed}")
              print(f"Score: {analysis_score}")
              print(f"Recommendation: {recommendation}")

          if errors or model_analysis_errors:
              for error in errors:
                  print(f"Validation error: {error}")
              for error in model_analysis_errors:
                  print(f"Model analysis error: {error}")
              sys.exit(1)
          PY

      - name: Write GitHub job summary
        if: always()
        env:
          ROUTE_ID: ${{ inputs.route_id }}
          INTERACTION_PROFILE_ID: ${{ inputs.interaction_profile_id }}
          ANALYSIS_MODE: ${{ inputs.analysis_mode }}
          MODEL_ID: ${{ inputs.model_id }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import pathlib

          artifact_dir = pathlib.Path("/tmp/real-public-browser-summary")
          summary_path = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          route_id_input = os.environ.get("ROUTE_ID", "unknown")
          profile_id_input = os.environ.get("INTERACTION_PROFILE_ID", "unknown")
          analysis_mode_input = os.environ.get("ANALYSIS_MODE", "single-model")
          model_id_input = os.environ.get("MODEL_ID", "not selected")

          def load_json(path):
              try:
                  with path.open("r", encoding="utf-8") as f:
                      return json.load(f)
              except FileNotFoundError:
                  return None
              except json.JSONDecodeError:
                  return None

          def safe_text(value):
              text = str(value if value is not None else "not available")
              return text.replace("|", "\\|").replace("\n", " ").strip()

          generated = load_json(artifact_dir / "generated-summary.json")
          validation = load_json(artifact_dir / "validation-report.json")
          model_report = load_json(artifact_dir / "model-report.json")
          qwen_report = load_json(artifact_dir / "model-report-qwen.json")
          deepseek_report = load_json(artifact_dir / "model-report-deepseek.json")
          comparison_report = load_json(artifact_dir / "model-comparison-report.json")
          existing_summary = (artifact_dir / "summary.md").exists()

          validation_passed = validation.get("valid") if validation else False
          forbidden_matches = validation.get("forbidden_scan_matches", []) if validation else []
          forbidden_count = len(forbidden_matches)
          model_analysis_errors = validation.get("model_analysis_errors", []) if validation else []
          model_analysis_ran = model_report is not None or qwen_report is not None or deepseek_report is not None
          model_passed = model_report.get("passed") if model_report else None
          model_score = model_report.get("score") if model_report else None
          recommendation = model_report.get("recommendation") if model_report else None
          agreement = comparison_report.get("agreement", {}) if comparison_report else {}
          combined_recommendation = comparison_report.get("combined_recommendation") if comparison_report else recommendation

          route_id = validation.get("route_id", route_id_input) if validation else route_id_input
          route_label = validation.get("route_label") if validation else None
          if generated:
              route_label = generated.get("route_label", route_label)
          interaction_profile = (
              validation.get("interaction_profile_id", profile_id_input)
              if validation else profile_id_input
          )

          provider = "not available"
          if comparison_report:
              provider = "qwen/deepseek"
          elif model_analysis_ran:
              if model_id_input.startswith("qwen/"):
                  provider = "qwen"
              elif model_id_input.startswith("deepseek/"):
                  provider = "deepseek"

          visible_count = len(generated.get("visible_text", [])) if generated else 0
          console_count = len(generated.get("console_errors", [])) if generated else 0
          network_count = len(generated.get("network_errors", [])) if generated else 0
          cta = generated.get("primary_cta_presence") if generated else None
          content_audit = generated.get("content_audit_signals") if generated else None
          seo_signals = generated.get("seo_basic_signals") if generated else None
          mobile_signals = generated.get("mobile_readiness_signals") if generated else None
          link_summary = generated.get("link_check_summary") if generated else None
          link_inventory = generated.get("public_link_inventory", []) if generated else []
          link_results = generated.get("public_link_check_results", []) if generated else []
          contact_signals = generated.get("contact_link_signals") if generated else None
          cta_value = "not available"
          cta_note = "not applicable"
          if isinstance(cta, dict):
              cta_value = str(cta.get("present"))
              if cta.get("present") is False:
                  cta_note = "CTA detection is sanitized visible-text only; false can mean absent, unexpected text, or not exposed to safe text capture."

          lines = [
              "# Real Public Browser Summary",
              "",
              "## Overall Status",
              "",
              f"- Validation passed: `{validation_passed}`",
              f"- Forbidden scan match groups: `{forbidden_count}`",
              f"- Model analysis ran: `{model_analysis_ran}`",
              f"- Analysis mode: `{safe_text(analysis_mode_input)}`",
              f"- Model analysis error count: `{len(model_analysis_errors)}`",
          ]
          if comparison_report:
              lines.extend([
                  f"- Qwen passed: `{qwen_report.get('passed') if qwen_report else 'not available'}`",
                  f"- Qwen score: `{qwen_report.get('score') if qwen_report else 'not available'}`",
                  f"- DeepSeek passed: `{deepseek_report.get('passed') if deepseek_report else 'not available'}`",
                  f"- DeepSeek score: `{deepseek_report.get('score') if deepseek_report else 'not available'}`",
                  f"- Score delta: `{agreement.get('score_delta', 'not available')}`",
                  f"- Passed agreement: `{agreement.get('passed_agreement', 'not available')}`",
              ])
          elif model_analysis_ran:
              lines.extend([
                  f"- Model report passed: `{model_passed}`",
                  f"- Score: `{model_score}`",
              ])
          else:
              lines.append("- Model report: `not available`")

          lines.extend([
              "",
              "## Run Context",
              "",
              f"- Route id: `{safe_text(route_id)}`",
              f"- Route label: `{safe_text(route_label)}`",
              f"- Interaction profile: `{safe_text(interaction_profile)}`",
              f"- Analysis mode: `{safe_text(analysis_mode_input)}`",
          ])
          if comparison_report:
              lines.extend([
                  "- Models: `qwen/qwen-plus`, `deepseek/deepseek-v4-flash`",
                  "- Provider: `qwen/deepseek`",
                  "- Compatibility note: `model-report.json` is a Qwen alias in dual-model mode.",
              ])
          elif model_analysis_ran:
              lines.extend([
                  f"- Model id: `{safe_text(model_id_input)}`",
                  f"- Provider: `{safe_text(provider)}`",
              ])

          lines.extend([
              "",
              "## Browser Observation",
              "",
              f"- Visible text snippet count: `{visible_count}`",
              f"- Console error summary count: `{console_count}`",
              f"- Network error summary count: `{network_count}`",
              f"- CTA presence: `{safe_text(cta_value)}`",
              f"- CTA detection note: {safe_text(cta_note)}",
          ])

          if content_audit:
              lines.extend([
                  "",
                  "## Content Audit Signals",
                  "",
                  f"- Target audience terms: `{safe_text(', '.join(content_audit.get('target_audience_terms_detected', [])) or 'none detected')}`",
                  f"- Offer terms: `{safe_text(', '.join(content_audit.get('offer_terms_detected', [])) or 'none detected')}`",
                  f"- CTA terms: `{safe_text(', '.join(content_audit.get('cta_terms_detected', [])) or 'none detected')}`",
                  f"- Trust signal terms: `{safe_text(', '.join(content_audit.get('trust_signal_terms_detected', [])) or 'none detected')}`",
                  f"- Legal service terms: `{safe_text(', '.join(content_audit.get('legal_service_terms_detected', [])) or 'none detected')}`",
                  f"- Long text block risk: `{content_audit.get('long_text_block_risk')}`",
                  f"- SEO page title present: `{(seo_signals or {}).get('page_title_present', 'not available')}`",
                  f"- SEO heading-like text present: `{(seo_signals or {}).get('heading_like_text_present', 'not available')}`",
                  f"- Mobile text-only readiness checked: `{(mobile_signals or {}).get('text_only_mobile_readiness_checked', 'not available')}`",
                  f"- Mobile visual layout checked: `{(mobile_signals or {}).get('visual_mobile_layout_checked', 'not available')}`",
                  f"- Mobile CTA text visible in text capture: `{(mobile_signals or {}).get('cta_text_visible_in_text_capture', 'not available')}`",
              ])

          if link_summary:
              broken = [item for item in link_results if item.get("result") in ("broken", "timeout", "error")][:5]
              skipped_sensitive = [
                  item for item in link_inventory
                  if item.get("result") in ("skipped_private_or_auth_like", "skipped_payment_like")
              ][:5]
              lines.extend([
                  "",
                  "## Link Check Results",
                  "",
                  f"- Total links seen: `{link_summary.get('total_links_seen')}`",
                  f"- Links checked: `{link_summary.get('links_checked_count')}`",
                  f"- OK links: `{link_summary.get('ok_count')}`",
                  f"- Broken links: `{link_summary.get('broken_count')}`",
                  f"- Redirected links: `{link_summary.get('redirected_count')}`",
                  f"- Skipped links: `{link_summary.get('skipped_count')}`",
                  f"- Contact links found: `{link_summary.get('contact_link_count')}`",
                  f"- Private/auth-like links skipped: `{link_summary.get('private_or_auth_like_count')}`",
                  f"- Payment-like links skipped: `{link_summary.get('payment_like_count')}`",
                  f"- Email link present: `{(contact_signals or {}).get('has_email_link', 'not available')}`",
                  f"- Phone link present: `{(contact_signals or {}).get('has_phone_link', 'not available')}`",
                  f"- Messenger link present: `{(contact_signals or {}).get('has_messenger_link', 'not available')}`",
                  "",
                  "Top broken/error links:",
              ])
              if broken:
                  for item in broken:
                      label = safe_text(item.get("label", "unlabeled link"))[:80]
                      lines.append(
                          f"- `{safe_text(item.get('result'))}` label `{label}` hash `{safe_text(item.get('url_hash'))}` "
                          f"status `{safe_text(item.get('status_code'))}`"
                      )
              else:
                  lines.append("- none")
              lines.extend(["", "Top skipped private/auth/payment-like links:"])
              if skipped_sensitive:
                  for item in skipped_sensitive:
                      label = safe_text(item.get("label", "unlabeled link"))[:80]
                      lines.append(
                          f"- `{safe_text(item.get('result'))}` label `{label}` type `{safe_text(item.get('link_type'))}`"
                      )
              else:
                  lines.append("- none")

          if comparison_report:
              lines.extend([
                  "",
                  "## Model Comparison",
                  "",
                  f"- Combined recommendation: {safe_text(combined_recommendation)}",
                  "",
                  "Top shared findings:",
              ])
              for item in comparison_report.get("shared_findings", [])[:5]:
                  lines.append(f"- {safe_text(item)}")
              lines.extend(["", "Top differences:"])
              for item in comparison_report.get("differences", [])[:5]:
                  lines.append(f"- {safe_text(item)}")
          elif model_analysis_ran:
              lines.extend([
                  "",
                  "## Model Recommendation",
                  "",
                  safe_text(recommendation),
              ])
              issues = model_report.get("issues", [])
              if issues:
                  lines.extend(["", "Top issues:"])
                  for issue in issues[:5]:
                      severity = safe_text(issue.get("severity", "unknown"))
                      description = safe_text(issue.get("description", "no description"))
                      evidence = safe_text(issue.get("evidence", "no evidence"))
                      lines.append(f"- `{severity}`: {description} Evidence: {evidence}")

          if validation and validation.get("errors"):
              lines.extend(["", "## Validation Errors", ""])
              for error in validation.get("errors", [])[:10]:
                  lines.append(f"- {safe_text(error)}")
          if model_analysis_errors:
              lines.extend(["", "## Model Analysis Errors", ""])
              for error in model_analysis_errors[:10]:
                  lines.append(f"- {safe_text(error)}")

          artifacts = [
              "generated-summary.json",
              "validation-report.json",
          ]
          if model_analysis_ran:
              artifacts.append("model-report.json")
          if qwen_report:
              artifacts.append("model-report-qwen.json")
          if deepseek_report:
              artifacts.append("model-report-deepseek.json")
          if comparison_report:
              artifacts.append("model-comparison-report.json")
          if existing_summary:
              artifacts.append("summary.md")
          if (artifact_dir / "report.html").exists():
              artifacts.append("report.html")
          if (artifact_dir / "report.pdf").exists():
              artifacts.append("report.pdf")

          lines.extend([
              "",
              "## Artifacts",
              "",
          ])
          for artifact in artifacts:
              lines.append(f"- `{artifact}`")

          lines.extend([
              "",
              "## Safety Note",
              "",
              "This job summary is generated from sanitized summary artifacts only.",
              "",
              "- No screenshots, videos, traces, or raw HAR.",
              "- No cookies, storage state, or auth headers.",
              "- No raw request or response bodies.",
              "- No raw provider response.",
          ])

          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload sanitized browser summary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-public-browser-summary
          path: |
            /tmp/real-public-browser-summary/generated-summary.json
            /tmp/real-public-browser-summary/validation-report.json
            /tmp/real-public-browser-summary/model-report.json
            /tmp/real-public-browser-summary/model-report-qwen.json
            /tmp/real-public-browser-summary/model-report-deepseek.json
            /tmp/real-public-browser-summary/model-comparison-report.json
            /tmp/real-public-browser-summary/summary.md
            /tmp/real-public-browser-summary/report.html
            /tmp/real-public-browser-summary/report.pdf
          if-no-files-found: error
          retention-days: 3
