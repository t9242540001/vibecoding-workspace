name: Agent Runner DeepSeek Docs PR

on:
  workflow_dispatch:
    inputs:
      target_path:
        description: Docs file to create or replace. Must start with docs/ and end with .md.
        required: true
        default: docs/agent-runner-deepseek-smoke-test.md
        type: string
      task_prompt:
        description: Docs-only task. DeepSeek must generate markdown content for target_path only.
        required: true
        type: string
      model:
        description: DeepSeek model to use
        required: true
        default: deepseek-v4-flash
        type: string
      branch_suffix:
        description: Short safe branch suffix
        required: true
        default: deepseek-docs-test
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deepseek-docs-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        env:
          TARGET_PATH: ${{ inputs.target_path }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail

          case "$TARGET_PATH" in
            docs/*.md) ;;
            *)
              echo "target_path must start with docs/ and end with .md."
              exit 1
              ;;
          esac

          case "$TARGET_PATH" in
            *..*|*\\*|.github/*|_local/*|.codex/*|*.env|*.env.*|*/.env|*/.env.*)
              echo "target_path is blocked by safety rules."
              exit 1
              ;;
          esac

          if [ -z "$MODEL" ]; then
            echo "Model input must not be empty."
            exit 1
          fi

          echo "Inputs validated."

      - name: Call DeepSeek docs generator
        env:
          TARGET_PATH: ${{ inputs.target_path }}
          TASK_PROMPT: ${{ inputs.task_prompt }}
          MODEL: ${{ inputs.model }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY secret is not available."
            exit 1
          fi

          python - <<'PY' > /tmp/deepseek-docs-pr-payload.json
          import json
          import os

          target_path = os.environ["TARGET_PATH"]
          task_prompt = os.environ["TASK_PROMPT"]

          system = (
              "Generate markdown documentation only. "
              "Return JSON only, no prose, no markdown fences. "
              f"The JSON path field must exactly equal {target_path!r}. "
              "The content field must be markdown. "
              "Do not include secrets, credentials, .env values, private URLs, local paths, or personal data. "
              "Do not generate code files. "
              "Do not modify more than one file."
          )

          user = (
              "Create or replace the target docs file from this task prompt.\n\n"
              f"Target path: {target_path}\n\n"
              f"Task prompt:\n{task_prompt}\n\n"
              "Return strict JSON only with this shape: "
              "{\"path\":\"docs/example.md\",\"content\":\"# Title\\n\\nMarkdown content here.\\n\"}"
          )

          payload = {
              "model": os.environ["MODEL"],
              "messages": [
                  {"role": "system", "content": system},
                  {"role": "user", "content": user},
              ],
              "thinking": {"type": "disabled"},
              "temperature": 0,
              "max_tokens": 1600,
          }
          print(json.dumps(payload))
          PY

          http_status="$(
            curl -sS \
              -o /tmp/deepseek-docs-pr-response.json \
              -w "%{http_code}" \
              -X POST "https://api.deepseek.com/chat/completions" \
              -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
              -H "Content-Type: application/json" \
              --data @/tmp/deepseek-docs-pr-payload.json
          )"

          echo "$http_status" > /tmp/deepseek-docs-pr-http-status.txt
          echo "HTTP status: $http_status"
          echo "Model: $MODEL"

          case "$http_status" in
            2*) ;;
            *)
              echo "DeepSeek request failed."
              if [ -s /tmp/deepseek-docs-pr-response.json ]; then
                echo "Response body:"
                cat /tmp/deepseek-docs-pr-response.json
              fi
              exit 1
              ;;
          esac

      - name: Parse response and write docs file
        env:
          TARGET_PATH: ${{ inputs.target_path }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import pathlib
          import sys

          target_path = os.environ["TARGET_PATH"]

          with open("/tmp/deepseek-docs-pr-response.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          choice = data["choices"][0]
          message = choice.get("message", {})
          model_content = (message.get("content") or "").strip()
          finish_reason = choice.get("finish_reason")
          response_model = data.get("model")
          usage = data.get("usage")

          if not model_content:
              print("Model content is empty.")
              print(f"Top-level keys: {sorted(data.keys())}")
              print(f"Finish reason: {finish_reason}")
              print(f"Message keys: {sorted(message.keys())}")
              if usage is not None:
                  print(f"Usage: {json.dumps(usage, sort_keys=True)}")
              sys.exit(1)

          try:
              generated = json.loads(model_content)
          except json.JSONDecodeError as exc:
              print(f"Generated content is not valid JSON: {exc}")
              sys.exit(1)

          if generated.get("path") != target_path:
              print("Generated JSON path does not match target_path.")
              print(f"Expected path: {target_path}")
              print(f"Actual path: {generated.get('path')}")
              sys.exit(1)

          content = generated.get("content")
          if not isinstance(content, str) or not content.strip():
              print("Generated JSON content is empty.")
              sys.exit(1)

          content = content.rstrip() + "\n"

          output_path = pathlib.Path(target_path)
          output_path.parent.mkdir(parents=True, exist_ok=True)
          output_path.write_text(content, encoding="utf-8")

          pathlib.Path("/tmp/deepseek-generated-content.md").write_text(content, encoding="utf-8")

          with open("/tmp/deepseek-docs-pr-http-status.txt", "r", encoding="utf-8") as f:
              http_status = f.read().strip()

          print(f"HTTP status: {http_status}")
          print(f"Requested model: {os.environ['MODEL']}")
          print(f"Response model: {response_model}")
          print(f"Finish reason: {finish_reason}")
          print(f"Target path: {target_path}")
          print(f"Content character count: {len(content)}")
          if usage is not None:
              print(f"Usage: {json.dumps(usage, sort_keys=True)}")
          PY

      - name: Check changed files
        id: changed
        env:
          TARGET_PATH: ${{ inputs.target_path }}
        run: |
          set -euo pipefail

          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/changed-files.txt

          if [ ! -s /tmp/changed-files.txt ]; then
            echo "No files changed."
            exit 1
          fi

          while IFS= read -r file; do
            if [ "$file" != "$TARGET_PATH" ]; then
              echo "Changed file does not match exact target path: $file"
              exit 1
            fi

            case "$file" in
              .github/*|_local/*|.codex/*|*.env|*.env.*|*/.env|*/.env.*)
                echo "Changed file is blocked by safety rules: $file"
                exit 1
                ;;
            esac
          done < /tmp/changed-files.txt

          git diff --check

          echo "Changed files:"
          cat /tmp/changed-files.txt

          {
            echo "changed_files<<EOF"
            cat /tmp/changed-files.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload DeepSeek response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-docs-pr-response
          path: /tmp/deepseek-docs-pr-response.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Create docs pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: DeepSeek docs update
          branch: agent/deepseek-docs-${{ github.run_id }}-${{ inputs.branch_suffix }}
          title: DeepSeek docs update
          body: |
            ## Target Path

            `${{ inputs.target_path }}`

            ## Model

            `${{ inputs.model }}`

            ## Task Prompt

            ${{ inputs.task_prompt }}

            ## Changed Files

            ```
            ${{ steps.changed.outputs.changed_files }}
            ```

            This is a DeepSeek docs-only PR runner prototype.

            Response artifact: `deepseek-docs-pr-response`.
          labels: agent-runner, docs, deepseek
          delete-branch: true
